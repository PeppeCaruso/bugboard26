<div class="login-container">
  <!-- <img src="/assets/login-illustration.svg" alt="illustration" class="login-illustration"> -->
  <div class="login-page">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>
          <span style="color: #005cbb; letter-spacing: 4px">BUGBOARD26</span>
        </mat-card-title>
        <mat-card-subtitle>Accedi per continuare</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <!-- Campo email -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="es. mario@bugboard.com">
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
              L'email è obbligatoria
            </mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
              Inserisci un'email valida
            </mat-error>
          </mat-form-field>

          <!-- Campo password -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="new-password">
            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              La password è obbligatoria
            </mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
              La password deve avere almeno 6 caratteri
            </mat-error>
          </mat-form-field>

          <!-- Messaggio errore credenziali -->
          <div class="error-message" *ngIf="errorMessage">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMessage }}</span>
          </div>

          <!-- Pulsante login -->
          <button
            mat-raised-button
            color="primary"
            type="submit"
            class="full-width login-button"
            [disabled]="loginForm.invalid || isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
            <span *ngIf="!isLoading">Accedi</span>
          </button>

        </form>
      </mat-card-content>
    </mat-card>
  </div>

</div>
